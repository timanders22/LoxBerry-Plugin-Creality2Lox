[HILFE]
K01 = "3D-Drucker (Creality2Lox)"
K02 = "Bindet einen Creality-Drucker mit Klipper und Moonraker an Loxone an — gemessen am <b>K2 Plus</b> (Moonraker-Schnittstelle 1.0.5, Port 7125, ohne Anmeldung). Keine Cloud, kein Konto, keine Anmeldung am Drucker."
K03 = "Kompatibel mit LoxBerry 3.x und 4.x (reines PHP, PHP 7.4, 8.4 und 8.5)."
K04 = "Was an Loxone geht"
K05 = "Druckzustand als Zahl und als einzelne Merker (bereit, druckt, pausiert, fertig, abgebrochen, Fehler), Klipper-Zustand."
K06 = "Fortschritt in Prozent, Restzeit (geschätzt aus Fortschritt und Druckzeit), Druckzeit, Schicht und Schichten gesamt, verbrauchtes Filament."
K07 = "Temperaturen von Düse, Bett und Kammer mit Sollwert und Heizleistung; Lüfter; Licht."
K08 = "Materialboxen (CFS) 1 bis 4: verbunden, Temperatur, Feuchte, je Fach belegt, Material, Farbe, Rest (Rohwert)."
K09 = "Lebenszeichen status/ok, status/ts und status/zaehler bei jedem Abruf."
K10 = "Wege"
K11 = "<b>MQTT</b> ist der Regelweg: das Plugin sendet an den UDP-Eingang des MQTT-Gateways, das Gateway gibt die Werte an Virtuelle Eingänge gleichen Namens im Miniserver weiter; diese legt man in Loxone Config an. Wahlweise gibt es einen <b>HTTP-Lesezweig</b> (virtueller HTTP-Eingang, Antwortzeile mit Befehlserkennung). Beide sind ab Werk aus."
K12 = "Befehle"
K13 = "Pause, Fortsetzen, Druck abbrechen, Notaus und Licht über die Befehlsbrücke (MQTT) oder den HTTP-Endpunkt mit Aktionstoken. Alles ist ab Werk aus; jede Stufe wird im Reiter Einstellungen einzeln freigegeben. <b>Keiner dieser Befehle ist am Gerät erprobt.</b> Vor jedem Befehl fragt das Plugin den Zustand neu ab; Pause gibt es nur während eines Drucks."
K14 = "Abfrage"
K15 = "Kein Dauerdienst: der Minutenlauf fragt Moonraker mit einem HTTP-Abruf je Takt (60, 30, 20, 15 oder 10 Sekunden). Antwortet der Drucker nicht (etwa ausgeschaltet), geht über MQTT nur status/ok = 0 hinaus; die übrigen Werte bleiben auf dem zuletzt gemessenen Stand, der HTTP-Lesezweig antwortet mit 503."
K16 = "Nicht benutzt"
K17 = "Die Creality-eigene Schnittstelle auf Port 9999 und die Kamera werden nicht benutzt."
K18 = "Sichern und Zurückspielen"
K19 = "Die Sicherungsdatei trägt alle Einstellungen samt Aktionstoken. Eine Datei mit fremden, unzulässigen oder fehlenden Einstellungen wird ganz abgelehnt."
