[HILFE]
K01 = "3D printer (Creality2Lox)"
K02 = "Connects a Creality printer running Klipper and Moonraker to Loxone — measured on the <b>K2 Plus</b> (Moonraker API 1.0.5, port 7125, no login). No cloud, no account, no login on the printer."
K03 = "Compatible with LoxBerry 3.x and 4.x (pure PHP, PHP 7.4, 8.4 and 8.5)."
K04 = "What is sent to Loxone"
K05 = "Print state as a number and as single flags (ready, printing, paused, complete, cancelled, error), Klipper state."
K06 = "Progress in percent, remaining time (estimated from progress and print time), print time, layer and total layers, filament used."
K07 = "Temperatures of nozzle, bed and chamber with target and heater power; fans; light."
K08 = "Material boxes (CFS) 1 to 4: connected, temperature, humidity, per slot loaded, material, colour, remaining (raw value)."
K09 = "Heartbeat status/ok, status/ts and status/zaehler on every query."
K10 = "Ways"
K11 = "<b>MQTT</b> is the regular way: the plugin sends to the UDP input of the MQTT gateway, the gateway passes the values to Virtual Inputs of the same name in the Miniserver; you create these in Loxone Config. Optionally there is an <b>HTTP read branch</b> (virtual HTTP input, answer line with command recognition). Both are off by default."
K12 = "Commands"
K13 = "Pause, resume, cancel print, emergency stop and light via the command bridge (MQTT) or the HTTP endpoint with action token. Everything is off by default; each level is released separately in the Settings tab. <b>None of these commands has been tested on the device.</b> Before each command the plugin re-queries the state; pause is only possible while printing."
K14 = "Polling"
K15 = "No permanent service: the minute run queries Moonraker with one HTTP request per interval (60, 30, 20, 15 or 10 seconds). If the printer does not answer (e.g. switched off), only status/ok = 0 is sent via MQTT; the other values stay at the last measured state, the HTTP read branch answers 503."
K16 = "Not used"
K17 = "The Creality interface on port 9999 and the camera are not used."
K18 = "Backup and restore"
K19 = "The backup file carries all settings including the action token. A file with foreign, invalid or missing settings is rejected as a whole."
