H_BEFEHLE = "Commands to the printer"
BEFEHLE_WARNUNG = "Commands act on the printer: <b>cancel</b> discards the running print, <b>emergency stop</b> shuts Klipper down (a firmware restart on the printer is needed afterwards). None of these commands has been tested on the device. Everything is off by default; each level is released separately."
