[EINST]
WAS_IST_DAS = "This plugin reads a Creality printer running Klipper and <b>Moonraker</b> (measured on the K2 Plus) via its HTTP interface in the home network and passes state, progress, remaining time, layer, temperatures, fans, light and the material boxes (CFS) to Loxone — via the MQTT gateway (MQTT tab), optionally via an HTTP read branch. It needs no cloud and no login on the printer. Commands (pause, resume, cancel, emergency stop, light) are off by default and <b>not tested on the device</b>."
