[AUTHOR]
NAME=Creality2Lox Plugin Authors
EMAIL=creality2lox@users.noreply.github.com

[PLUGIN]
VERSION=0.9.1
NAME=creality2lox
FOLDER=creality2lox
TITLE=3D-Drucker (Creality2Lox)

[AUTOUPDATE]
# Automatische Updates ueber GitHub (release.cfg im Repository
# timanders22/LoxBerry-Plugin-Creality2Lox, Zweig main; angelegt am 12.11.2026).
# Erste Fassung 0.9.1: release.cfg und prerelease.cfg nennen 0.9.1 schon im ersten
# Commit, weil es keine aeltere Nummer gibt; bis der Tag v0.9.1 steht, antwortet
# die Archivadresse mit 404.
# Bei einem Release: VERSION hier und in release.cfg/prerelease.cfg erhoehen,
# Tag vX.Y.Z anlegen - installierte LoxBerrys ziehen dann automatisch nach.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Creality2Lox/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Creality2Lox/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
