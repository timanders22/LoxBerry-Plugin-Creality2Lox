<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    
    <!-- Main Center Motif: Creality 3D Printer (Ender Style) -->
    <g transform="translate(256, 195) scale(1.3)">
      
      <!-- Filament Spool & Bracket -->
      <rect x="-6" y="-75" width="12" height="25" rx="1" />
      <circle cx="0" cy="-85" r="22" />
      <circle cx="0" cy="-85" r="14" fill="#6dac20" />
      <circle cx="0" cy="-85" r="4" fill="#ffffff" />
      
      <!-- Filament Path to Extruder -->
      <path d="M -14 -85 C -45 -85 -45 -15 -10 -5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

      <!-- Frame: Top Bar -->
      <rect x="-42" y="-50" width="84" height="10" rx="1" />
      
      <!-- Frame: Z-Axis Pillars -->
      <rect x="-40" y="-40" width="12" height="95" rx="1" />
      <rect x="28" y="-40" width="12" height="95" rx="1" />

      <!-- Base & Heatbed -->
      <rect x="-55" y="55" width="110" height="15" rx="2" />
      <rect x="-25" y="48" width="50" height="7" rx="1" />
      <rect x="-10" y="42" width="20" height="6" rx="1" fill="#6dac20" /> <!-- Spacer/Shadow -->

      <!-- Printed Object (Layered Box) -->
      <path d="M -8 30 h 16 v 18 h -16 z" fill="#ffffff" />
      <line x1="-8" y1="35" x2="8" y2="35" stroke="#6dac20" stroke-width="1.5" />
      <line x1="-8" y1="40" x2="8" y2="40" stroke="#6dac20" stroke-width="1.5" />
      <line x1="-8" y1="45" x2="8" y2="45" stroke="#6dac20" stroke-width="1.5" />

      <!-- X-Axis Gantry -->
      <rect x="-48" y="5" width="96" height="8" rx="1" />

      <!-- Extruder / Print Head -->
      <rect x="-14" y="-5" width="28" height="22" rx="2" />
      <polygon points="-4,17 4,17 0,25" fill="#ffffff" /> <!-- Nozzle -->
      <circle cx="0" cy="6" r="5" fill="#6dac20" /> <!-- Hotend Fan Cutout -->

      <!-- Control Box with Display (Right Side) -->
      <rect x="42" y="32" width="26" height="38" rx="2" />
      <rect x="45" y="35" width="20" height="16" rx="1" fill="#6dac20" /> <!-- LCD Screen Cutout -->
      <circle cx="55" cy="59" r="5" fill="#6dac20" /> <!-- Control Knob Cutout -->

    </g>

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="0.5">Creality</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>